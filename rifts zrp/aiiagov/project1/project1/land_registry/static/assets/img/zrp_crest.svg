<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Royal Blue & Gold Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A3682" />
      <stop offset="70%" stop-color="#002070" />
      <stop offset="100%" stop-color="#001240" />
    </radialGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA820A" />
      <stop offset="75%" stop-color="#F0CE5E" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>

    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF4B8" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C6D05" />
    </linearGradient>

    <linearGradient id="blueShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0047BA" />
      <stop offset="50%" stop-color="#002984" />
      <stop offset="100%" stop-color="#00174A" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Ring with Shadow -->
  <circle cx="250" cy="250" r="235" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#shadow)" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="#FCE082" stroke-width="2" stroke-dasharray="4,4" opacity="0.8" />
  <circle cx="250" cy="250" r="214" fill="none" stroke="url(#goldGrad)" stroke-width="5" />

  <!-- Circular Text Paths -->
  <path id="textPathTop" d="M 70,250 A 180,180 0 1,1 430,250" fill="none" />
  <path id="textPathBottom" d="M 430,250 A 180,180 0 0,1 70,250" fill="none" />

  <text font-family="'Inter', 'Arial Black', sans-serif" font-size="21" font-weight="900" fill="url(#goldSheen)" letter-spacing="4.5">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      ★ ZIMBABWE REPUBLIC POLICE ★
    </textPath>
  </text>

  <text font-family="'Inter', 'Arial Black', sans-serif" font-size="20" font-weight="800" fill="url(#goldSheen)" letter-spacing="5">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      • PRO LEGE, PRO PATRIA, PRO POPULO •
    </textPath>
  </text>

  <!-- Inner Crest Ring -->
  <circle cx="250" cy="250" r="148" fill="url(#blueShieldGrad)" stroke="url(#goldGrad)" stroke-width="6" filter="url(#shadow)" />

  <!-- Police Star (8-Point Faceted Star) -->
  <g id="policeStar" filter="url(#shadow)">
    <!-- 8 ray facets in gold and navy -->
    <path d="M 250,115 L 265,190 L 340,165 L 290,225 L 365,250 L 290,275 L 340,335 L 265,310 L 250,385 L 235,310 L 160,335 L 210,275 L 135,250 L 210,225 L 160,165 L 235,190 Z" 
          fill="url(#goldGrad)" stroke="#FFF4B8" stroke-width="2" />
  </g>

  <!-- Central Police Shield -->
  <g id="centralShield" filter="url(#shadow)">
    <path d="M 250,160 Q 300,160 310,210 Q 310,290 250,335 Q 190,290 190,210 Q 200,160 250,160 Z"
          fill="url(#blueShieldGrad)" stroke="url(#goldSheen)" stroke-width="5" />
  </g>

  <!-- Scales of Justice Symbol inside Shield -->
  <g id="scalesOfJustice" stroke="url(#goldSheen)" stroke-width="3" fill="none" stroke-linecap="round">
    <!-- Center Pillar -->
    <line x1="250" y1="185" x2="250" y2="295" stroke-width="4" stroke="url(#goldGrad)" />
    <!-- Pillar Base -->
    <line x1="235" y1="295" x2="265" y2="295" stroke-width="5" stroke="url(#goldGrad)" />
    <!-- Top Finial / Star -->
    <circle cx="250" cy="182" r="5" fill="url(#goldGrad)" stroke="#FFF" stroke-width="1.5" />
    <!-- Balance Beam -->
    <line x1="210" y1="205" x2="290" y2="205" stroke-width="3.5" stroke="url(#goldGrad)" />
    
    <!-- Left Scale Pan -->
    <line x1="210" y1="205" x2="200" y2="245" stroke-width="1.5" />
    <line x1="210" y1="205" x2="220" y2="245" stroke-width="1.5" />
    <path d="M 195,245 Q 210,255 225,245 Z" fill="url(#goldGrad)" stroke="url(#goldSheen)" stroke-width="1.5" />

    <!-- Right Scale Pan -->
    <line x1="290" y1="205" x2="280" y2="245" stroke-width="1.5" />
    <line x1="290" y1="205" x2="300" y2="245" stroke-width="1.5" />
    <path d="M 275,245 Q 290,255 305,245 Z" fill="url(#goldGrad)" stroke="url(#goldSheen)" stroke-width="1.5" />
  </g>

  <!-- RIFTS-X Governance Banner in Gold -->
  <g id="banner" transform="translate(0, 10)">
    <path d="M 170,360 L 250,350 L 330,360 L 315,385 L 250,375 L 185,385 Z"
          fill="url(#goldGrad)" stroke="#00174A" stroke-width="2" filter="url(#shadow)" />
    <text x="250" y="372" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#00174A" text-anchor="middle" letter-spacing="3">
      RIFTS-X
    </text>
  </g>
</svg>

{% extends 'base.html' %}
{% load static %}
{% block pageContent %}
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .ai-assistant-wrapper {
        display: flex;
        height: calc(100vh - 80px);
        background: linear-gradient(135deg, #f5f5f5 0%, #fafafa 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell;
    }

    .conversation-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: white;
        border-right: 1px solid #e0e0e0;
        min-width: 0;
    }

    .conversation-header {
        padding: 1.5rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .conversation-title {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
    }

    .conversation-subtitle {
        font-size: 0.9rem;
        opacity: 0.9;
    }

    .messages-container {
        flex: 1;
        overflow-y: auto;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .message {
        display: flex;
        margin-bottom: 1rem;
        animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .message.user {
        justify-content: flex-end;
    }

    .message.assistant {
        justify-content: flex-start;
    }

    .message-content {
        max-width: 70%;
        padding: 1rem 1.5rem;
        border-radius: 1rem;
        word-wrap: break-word;
    }

    .user .message-content {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-bottom-right-radius: 0.25rem;
    }

    .assistant .message-content {
        background: #f0f0f0;
        color: #333;
        border-bottom-left-radius: 0.25rem;
    }

    .assistant .message-content a {
        color: #667eea;
        text-decoration: none;
        font-weight: 500;
    }

    .input-area {
        padding: 1rem 1.5rem;
        background: white;
        border-top: 1px solid #e0e0e0;
        display: flex;
        gap: 0.75rem;
    }

    .input-field {
        flex: 1;
        display: flex;
        align-items: center;
        background: #f5f5f5;
        border: 1px solid #e0e0e0;
        border-radius: 0.5rem;
        padding: 0 1rem;
        transition: all 0.2s;
    }

    .input-field:focus-within {
        border-color: #667eea;
        background: white;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .query-input {
        flex: 1;
        border: none;
        background: transparent;
        outline: none;
        font-size: 1rem;
        padding: 0.75rem;
        color: #333;
    }

    .query-input::placeholder {
        color: #999;
    }

    .send-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        color: white;
        border-radius: 0.5rem;
        padding: 0.75rem 1.5rem;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.2s;
    }

    .send-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .send-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .sidebar {
        width: 300px;
        background: #f9f9f9;
        border-left: 1px solid #e0e0e0;
        padding: 1.5rem;
        overflow-y: auto;
    }

    .sidebar-section {
        margin-bottom: 2rem;
    }

    .sidebar-title {
        font-size: 0.9rem;
        font-weight: 700;
        text-transform: uppercase;
        color: #666;
        margin-bottom: 0.75rem;
        letter-spacing: 0.5px;
    }

    .quick-prompts {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .quick-prompt-btn {
        padding: 0.75rem;
        background: white;
        border: 1px solid #ddd;
        border-radius: 0.5rem;
        cursor: pointer;
        font-size: 0.85rem;
        text-align: left;
        transition: all 0.2s;
        color: #333;
    }

    .quick-prompt-btn:hover {
        background: #e8e8ff;
        border-color: #667eea;
        color: #667eea;
    }

    .status-card {
        background: white;
        border-radius: 0.5rem;
        padding: 0.75rem;
        border-left: 3px solid #667eea;
    }

    .status-card.warning {
        border-left-color: #ff6b6b;
    }

    .status-card.success {
        border-left-color: #51cf66;
    }

    .status-label {
        font-size: 0.75rem;
        font-weight: 700;
        color: #666;
        text-transform: uppercase;
    }

    .status-value {
        font-size: 0.9rem;
        font-weight: 600;
        color: #333;
    }

    .loading-indicator {
        display: flex;
        gap: 0.3rem;
        align-items: center;
    }

    .loading-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #667eea;
        animation: blink 1.4s infinite;
    }

    .loading-dot:nth-child(2) {
        animation-delay: 0.2s;
    }

    .loading-dot:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes blink {
        0%, 60%, 100% { opacity: 0.3; }
        30% { opacity: 1; }
    }

    .result-item {
        padding: 0.75rem;
        background: #f9f9f9;
        border-left: 3px solid #667eea;
        margin: 0.5rem 0;
        border-radius: 0.25rem;
        font-size: 0.9rem;
    }

    .result-item-title {
        font-weight: 600;
        color: #333;
        margin-bottom: 0.25rem;
    }

    .result-item-desc {
        font-size: 0.85rem;
        color: #666;
    }

    @media (max-width: 768px) {
        .sidebar {
            display: none;
        }
        
        .message-content {
            max-width: 100%;
        }
    }
</style>

<div class="ai-assistant-wrapper">
    <!-- Conversation Panel -->
    <div class="conversation-panel">
        <div class="conversation-header">
            <div class="conversation-title">🤖 RIFTS-X Intelligence</div>
            <div class="conversation-subtitle">Your AI-powered governance and records assistant</div>
        </div>

        <div class="messages-container" id="messagesContainer">
            <!-- Messages will be added here -->
        </div>

        <div class="input-area">
            <div class="input-field">
                <input type="text" id="ai-query-input" class="query-input" 
                    placeholder="Ask me anything about records, projects, contracts, leave, assets...">
            </div>
            <button class="send-btn" id="send-btn" onclick="sendQuery()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-title">Quick Actions</div>
            <div class="quick-prompts">
                <button class="quick-prompt-btn" onclick="quickQuery('System status')">📊 System Status</button>
                <button class="quick-prompt-btn" onclick="quickQuery('Show me overdue tasks')">⚠️ Overdue Tasks</button>
                <button class="quick-prompt-btn" onclick="quickQuery('List active projects')">📋 Active Projects</button>
                <button class="quick-prompt-btn" onclick="quickQuery('Show pending approvals')">✅ Pending Approvals</button>
            </div>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-title">System Health</div>
            <div class="status-card" id="healthCard">
                <div class="status-label">Loading...</div>
            </div>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-title">Quick Stats</div>
            <div id="statsContainer"></div>
        </div>
    </div>
</div>

<script>
function sendQuery() {
    const query = document.getElementById('ai-query-input').value.trim();
    if (!query) return;
    
    addMessage(query, 'user');
    document.getElementById('ai-query-input').value = '';
    
    showLoadingIndicator();
    
    // Get CSRF token from cookie
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    
    const csrftoken = getCookie('csrftoken');
    
    fetch('{% url "process-ai-query" %}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': csrftoken || ''
        },
        body: 'query=' + encodeURIComponent(query)
    })
    .then(r => {
        if (!r.ok) {
            throw new Error(`HTTP ${r.status}: ${r.statusText}`);
        }
        return r.text();
    })
    .then(text => {
        removeLoadingIndicator();
        try {
            const data = JSON.parse(text);
            if (data.status === 'success') {
                displayResponse(data.results);
            } else {
                addMessage('Error: ' + (data.msg || 'Unknown error'), 'assistant');
            }
        } catch (e) {
            addMessage('System error: Unable to process response. Please try again.', 'assistant');
            console.error('Parse error:', e, 'Response:', text.substring(0, 200));
        }
    })
    .catch(err => {
        removeLoadingIndicator();
        addMessage('Connection error: ' + err.message, 'assistant');
        console.error('Fetch error:', err);
    });
}

function addMessage(text, role, isHtml = false) {
    const container = document.getElementById('messagesContainer');
    const msgEl = document.createElement('div');
    msgEl.className = 'message ' + role;
    const content = isHtml ? text : escapeHtml(text);
    msgEl.innerHTML = `<div class="message-content">${content}</div>`;
    container.appendChild(msgEl);
    container.scrollTop = container.scrollHeight;
}

function displayResponse(results) {
    let response = results.summary || 'No results found';
    
    if (results.data && results.data.length > 0) {
        response += '<div style="margin-top: 1rem;">';
        results.data.slice(0, 3).forEach(item => {
            response += `<div class="result-item">
                <div class="result-item-title">${escapeHtml(item.title)}</div>
                <div class="result-item-desc">${escapeHtml(item.description)}</div>
            </div>`;
        });
        response += '</div>';
    }
    
    addMessage(response, 'assistant', true);
}

function showLoadingIndicator() {
    const container = document.getElementById('messagesContainer');
    const msgEl = document.createElement('div');
    msgEl.className = 'message assistant loading-msg';
    msgEl.innerHTML = `<div class="message-content"><div class="loading-indicator">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
    </div></div>`;
    container.appendChild(msgEl);
    container.scrollTop = container.scrollHeight;
}

function removeLoadingIndicator() {
    const loadingMsg = document.querySelector('.message.loading-msg');
    if (loadingMsg) loadingMsg.remove();
}

function quickQuery(query) {
    document.getElementById('ai-query-input').value = query;
    sendQuery();
}

function escapeHtml(text) {
    const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    };
    return text.replace(/[&<>"']/g, m => map[m]);
}

// Initialize
document.addEventListener('DOMContentLoaded', function() {
    addMessage("👋 Welcome to RIFTS-X Intelligence! I'm your AI assistant for governance, records, and procurement management. Ask me anything about your system.", 'assistant');
});

// Enter key support
document.getElementById('ai-query-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendQuery();
});
</script>
{% endblock pageContent %}

{% extends 'base.html' %}
{% load static %}
{% block pageContent %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-white">
          <h5 class="mb-0">Manage Your Signature</h5>
        </div>
        <div class="card-body">
          <p class="small text-muted">Draw a signature or upload an image. Saved signature will be available when signing documents.</p>
          <div class="mb-3">
            <div class="border rounded bg-white p-3 text-center">
              <canvas id="signaturePad" width="600" height="180" style="background:#fafafa; display:block; margin:0 auto;"></canvas>
            </div>
            <div class="mt-2 text-center">
              <button id="clearPad" class="btn btn-sm btn-outline-secondary">Clear</button>
            </div>
          </div>
          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="hidden" name="signature_data" id="signature_data_input">
            <div class="mb-3">
              <label class="form-label small">Or upload a signature image</label>
              <input type="file" name="signature_file" class="form-control form-control-sm">
            </div>
            <div class="d-flex justify-content-end">
              <a href="{% url 'leave-applications' %}" class="btn btn-light me-2">Cancel</a>
              <button type="submit" class="btn btn-primary" id="saveSigBtn">Save Signature</button>
            </div>
          </form>
          {% if profile.signature_data %}
            <hr>
            <div class="mt-3">
              <div class="small text-muted mb-2">Current Saved Signature</div>
              <img src="{{ profile.signature_data }}" style="height:80px;">
            </div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
<script>
  const canvas = document.getElementById('signaturePad');
  const pad = new SignaturePad(canvas, {backgroundColor:'rgba(255,255,255,0)', penColor:'#000033'});
  document.getElementById('clearPad').addEventListener('click', ()=> pad.clear());
  document.querySelector('form').addEventListener('submit', function(e){
    if (!pad.isEmpty()){
      document.getElementById('signature_data_input').value = pad.toDataURL();
    }
  });
</script>
{% endblock %}

<div class="container-fluid px-0">
    <div class="card border-0 shadow-sm"
        style="border-radius: 20px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);">
        <div class="card-body p-4">
            <form action="" id="category-form">
                <input type="hidden" name="id" value="{{category.id}}">
                <div class="mb-4">
                    <label for="name" class="form-label small fw-bold text-dark text-uppercase mb-2"
                        style="letter-spacing: 0.5px;"> Classification Name</label>
                    <div class="input-group shadow-sm rounded-pill overflow-hidden">
                        <span class="input-group-text border-0 bg-white ps-3 text-muted"> <i
                                class="fas fa-tag"></i></span>
                        <input type="text" id="name" name="name" class="form-control border-0 bg-white py-2 px-3"
                            value="{{category.name}}" required placeholder="Enter Category Name"
                            style="font-size: 0.9rem;"></div></div>
                <div class="mb-4">
                    <label for="description" class="form-label small fw-bold text-dark text-uppercase mb-2"
                        style="letter-spacing: 0.5px;"> Strategic Description</label>
                    <textarea rows="3" id="description" name="description"
                        class="form-control border-0 shadow-sm rounded-4 px-3 py-3" required
                        placeholder="Define the scope of this category..."
                        style="font-size: 0.9rem; background: #fcfcfc;"> {{category.description}}</textarea></div>
                <div class="mb-4">
                    <label for="status" class="form-label small fw-bold text-dark text-uppercase mb-2"
                        style="letter-spacing: 0.5px;"> Operational Status</label>
                    <div class="input-group shadow-sm rounded-pill overflow-hidden">
                        <span class="input-group-text border-0 bg-white ps-3 text-muted"> <i
                                class="fas fa-toggle-on"></i></span>
                        <select id="status" name="status" class="form-select border-0 bg-white py-2 px-3" required
                            style="font-size: 0.9rem;">
                            <option value="1" {% if category.status == '1' %}selected{% endif %} > Active & Visible</option>
                            <option value="0" {% if category.status == '0' or category.status == '2' %}selected{% endif %}>
                                Inactive / Archived</option></select></div></div></form></div></div></div>

<style>#category-form .form-control:focus,
    #category-form .form-select:focus {
        box-shadow: none !important;
        background-color: #fff !important;
    }

    #category-form .input-group:focus-within {
        ring: 2px solid #4facfe;
    }</style>
<script>$(function () {
        $('#category-form').submit(function (e) {
            e.preventDefault();
            var _this = $(this)
            $('.err-msg').remove();
            var el = $(' <div>')
            el.addClass("alert alert-danger err-msg rounded-3 small p-2 mb-3")
            el.hide()
            if (_this[0].checkValidity() == false) {
                _this[0].reportValidity();
                return false;
            }
            start_loader();
            $.ajax({
                headers: {
                    "X-CSRFToken": '{{csrf_token}}'
                },
                url: "{% url 'save-category' %}",
                data: new FormData($(this)[0]),
                cache: false,
                contentType: false,
                processData: false,
                method: 'POST',
                type: 'POST',
                dataType: 'json',
                error: err => {
                    console.log(err)
                    alert("An error occured", 'error');
                    end_loader();
                },
                success: function (resp) {
                    if (typeof resp == 'object' && resp.status == 'success') {
                        location.reload()
                    } else if (resp.status == 'failed' && !!resp.msg) {
                        el.text(resp.msg)
                    } else {
                        el.text("An error occured", 'error');
                        end_loader();
                        console.error(resp)
                    }
                    _this.prepend(el)
                    el.show('slow')
                    $("html, body, .modal").scrollTop(0);
                    end_loader()
                }
            })
        })
    })</script>

{% extends 'base.html' %}{% load static %}{% block pageContent %}
<div class="container-fluid d-flex flex-column min-vh-100 justify-content-center align-items-center py-5">
    <div class="col-lg-5 col-md-7 col-sm-12">
        <!-- Logo & Title Area -->
        <div class="text-center mb-5 animate-fade-in">
            <div class="bg-primary bg-opacity-10 d-inline-flex align-items-center justify-content-center rounded-circle mb-3 shadow-sm"
                style="width: 80px; height: 80px; border: 1px solid rgba(0, 123, 255, 0.2);">
                <i class="fas fa-user-plus text-primary display-5"></i></div>
            <h1 class="fw-bold mb-1 h3"> {{system_name}}</h1>
            <p class="text-muted small"> Create your staff account</p></div>

        <!-- Registration Card -->
        <div class="glass-card border-0 shadow-lg overflow-hidden animate-slide-up">
            <div class="card-body p-4 p-md-5">
                <div class="mb-4">
                    <h4 class="fw-bold h5"> Sign Up</h4>
                    <p class="text-muted small"> Fill in the details below to register</p></div>

                <form id="register-user" action="" method="POST">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="first_name" class="form-label small fw-bold"> First Name</label>
                            <input type="text" class="form-control bg-transparent rounded-pill px-3" name="first_name"
                                id="first_name" placeholder="John" required></div>
                        <div class="col-md-6 mb-3">
                            <label for="last_name" class="form-label small fw-bold"> Last Name</label>
                            <input type="text" class="form-control bg-transparent rounded-pill px-3" name="last_name"
                                id="last_name" placeholder="Doe" required></div></div>

                    <div class="form-group mb-3">
                        <label for="email" class="form-label small fw-bold"> Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted small px-3">
                                <i class="fas fa-envelope"></i></span>
                            <input type="email" class="form-control bg-transparent border-start-0 ps-0"
                                placeholder="john.doe@example.com" name="email" id="email" required></div></div>

                    <div class="form-group mb-3">
                        <label for="username" class="form-label small fw-bold"> Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted small px-3">
                                <i class="fas fa-user"></i></span>
                            <input type="text" class="form-control bg-transparent border-start-0 ps-0 font-monospace"
                                placeholder="jdoe" name="username" id="username" required></div></div>

                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label for="department" class="form-label small fw-bold"> Department</label>
                            <select class="form-select bg-transparent rounded-pill px-3" name="department" id="department" required>
                                <option value="" disabled selected>Select Department</option>
                                {% for dept in departments %}
                                <option value="{{ dept.id }}">{{ dept.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="job_title" class="form-label small fw-bold"> Job Title</label>
                            <input type="text" class="form-control bg-transparent rounded-pill px-3" name="job_title" id="job_title" placeholder="e.g. Senior Records Officer">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="position" class="form-label small fw-bold"> Position / Grade</label>
                            <input type="text" class="form-control bg-transparent rounded-pill px-3" name="position" id="position" placeholder="e.g. Grade D">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="platform" class="form-label small fw-bold"> Platform Access</label>
                            <select class="form-select bg-transparent rounded-pill px-3" name="platform" id="platform" required>
                                <option value="RIFTS-X">RIFTS-X Master</option>
                                <option value="Governance">Project Governance</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="requested_role" class="form-label small fw-bold"> System Role</label>
                            <select class="form-select bg-transparent rounded-pill px-3" name="requested_role" id="requested_role" required>
                                <optgroup label="── ZRP Directorate / Apex Tier ──">
                                    <option value="Chief Director">Chief Director (Executive Oversight - All)</option>
                                    <option value="Deputy Director ICT">Deputy Director ICT (Systems)</option>
                                    <option value="Deputy Director Communications">Deputy Director Communications (Comms &amp; Radio)</option>
                                    <option value="Deputy Director IT">Deputy Director IT (Legacy / Systems)</option>
                                </optgroup>
                                <optgroup label="── ZRP Management Tier ──">
                                    <option value="Systems Manager">Systems Manager (ICT Systems)</option>
                                    <option value="System Manager">System Manager (Systems)</option>
                                    <option value="Supt ICT">Superintendent ICT (Supt ICT)</option>
                                    <option value="Chief Tech">Chief Technician (Chief Tech - Comms &amp; Radio)</option>
                                    <option value="Department Manager">Department Manager</option>
                                    <option value="Supervisor">Registry Supervisor</option>
                                    <option value="HODs">Head of Departments (HODs)</option>
                                </optgroup>
                                <optgroup label="── ZRP Operational &amp; Field Officers ──">
                                    <option value="General Police">General Police Officer</option>
                                    <option value="Clerk">Registry Clerk</option>
                                    <option value="Provincial ICT Officer">Provincial ICT Officer (PICTO)</option>
                                    <option value="Auditor">System Auditor</option>
                                </optgroup>
                                <optgroup label="── Procurement &amp; Finance ──">
                                    <option value="Purchasing Officer">Purchasing Officer</option>
                                    <option value="Finance Officer">Finance Officer</option>
                                </optgroup>
                                <optgroup label="── Project Governance &amp; Strategy ──">
                                    <option value="Team Member" selected>Team Member</option>
                                    <option value="Project Leader">Project Leader</option>
                                    <option value="Project Management Team">Project Management Team</option>
                                    <option value="Board of Executives">Board of Executives / Executive Committee</option>
                                    <option value="Portfolio Admin">Portfolio Admin</option>
                                    <option value="Executive">Executive Officer</option>
                                    <option value="Executive Viewer">Executive Viewer</option>
                                </optgroup>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="password1" class="form-label small fw-bold"> Password</label>
                            <input type="password" class="form-control bg-transparent rounded-pill px-3"
                                name="password1" id="password1" placeholder="••••••••" required></div>
                        <div class="col-md-6 mb-4">
                            <label for="password2" class="form-label small fw-bold"> Confirm Password</label>
                            <input type="password" class="form-control bg-transparent rounded-pill px-3"
                                name="password2" id="password2" placeholder="••••••••" required></div></div>

                    <button class="btn btn-primary w-100 py-2 rounded-pill shadow-sm mt-2 transition-all hover-scale">
                        Create Account</button>

                    <div class="mt-4 text-center">
                        <p class="text-muted extra-small mb-0"> Already have an account? <a href="{% url 'login-page' %}"
                                class="text-primary fw-bold text-decoration-none"> Sign In</a></p></div></form></div></div></div></div>

<style>.animate-fade-in {
        animation: fadeIn 0.8s ease-out;
    }

    .animate-slide-up {
        animation: slideUp 0.6s ease-out;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .form-control:focus {
        box-shadow: none;
        border-color: var(--primary-color);
    }

    .input-group-text {
        border-color: #dee2e6;
    }

    .form-control {
        border-color: #dee2e6;
        font-size: 0.9rem;
    }</style>
{% endblock pageContent %}

{% block ScriptBlock %}
<script>$(function () {
        $('#register-user').submit(function (e) {
            e.preventDefault();
            var _this = $(this)
            $('.err-msg').remove();
            var el = $(' <div>')
            el.addClass("alert alert-danger err-msg rounded-3 small p-2 mb-3")
            el.hide()
            if (_this[0].checkValidity() == false) {
                _this[0].reportValidity();
                return false;
            }
            start_loader();
            $.ajax({
                headers: {
                    "X-CSRFToken": '{{csrf_token}}'
                },
                url: "{% url 'register-user' %}",
                data: new FormData($(this)[0]),
                cache: false,
                contentType: false,
                processData: false,
                method: 'POST',
                type: 'POST',
                dataType: 'json',
                error: err => {
                    console.error(err)
                    alert("An error occurred", 'error');
                    end_loader();
                },
                success: function (resp) {
                    if (typeof resp == 'object' && resp.status == 'success') {
                        var email = resp.user_email || 'your email';
                        var platform = resp.platform || 'RIFTS-X';
                        var sentMsg = resp.email_sent
                            ? '<p style="color:#555;font-size:15px;">A verification link has been sent to <strong>' + email + '</strong>.<br>Please check your inbox <em>(and your spam/junk folder)</em> and click the link to activate your account.</p>'
                            : '<p style="color:#c0392b;font-size:15px;">We could not send the email automatically. Please use the <strong>Resend Verification Email</strong> option on the login page, or contact your administrator.</p>';
                        $('body').html(`
                            <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f6f9;font-family:Arial,sans-serif;">
                              <div style="max-width:520px;width:100%;background:#fff;border-radius:14px;padding:44px 40px;box-shadow:0 4px 24px rgba(0,0,0,.10);text-align:center;">
                                <div style="width:80px;height:80px;background:#e8f5e9;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
                                  <span style="font-size:40px;">&#9993;</span>
                                </div>
                                <h2 style="color:#1a237e;margin-bottom:8px;">Registration Successful!</h2>
                                <p style="color:#888;font-size:14px;margin-bottom:20px;">Welcome to <strong>` + platform + `</strong></p>
                                ` + sentMsg + `
                                <div style="margin:32px 0 16px;">
                                  <a href="{% url 'login-page' %}" style="background:#1a237e;color:#fff;padding:13px 36px;border-radius:50px;font-size:15px;font-weight:bold;text-decoration:none;display:inline-block;">
                                    Go to Login
                                  </a>
                                </div>
                                <p style="color:#aaa;font-size:12px;">If you did not receive the email, go to the login page and use the <em>Resend Verification Email</em> option.</p>
                              </div>
                            </div>
                        `);
                    } else if (resp.status == 'failed' && !!resp.msg) {
                        el.html(resp.msg)
                        _this.prepend(el)
                        el.show('slow')
                        $("html, body, .modal").scrollTop(0);
                    } else {
                        el.text("An error occurred");
                        _this.prepend(el)
                        el.show('slow')
                        console.error(resp)
                    }
                    end_loader()
                }
            })
        })
    })</script>
{% endblock ScriptBlock %}

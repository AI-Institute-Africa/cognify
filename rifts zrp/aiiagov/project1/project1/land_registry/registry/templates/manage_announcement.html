{% load static %}
<div class="container-fluid">
    <form action="" id="announcement-form">
        {% csrf_token %}
        <input type="hidden" name="id" value="{{ pk|default:'' }}">

        <div class="mb-3">
            <label for="title" class="control-label text-muted small fw-bold text-uppercase"> Notice Title</label>
            {{ form.title }}</div>

        <div class="mb-3">
            <label for="content" class="control-label text-muted small fw-bold text-uppercase"> Announcement
                Content</label>
            {{ form.content }}</div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="priority" class="control-label text-muted small fw-bold text-uppercase"> Priority
                    Level</label>
                {{ form.priority }}</div>
            <div class="col-md-6 mb-3">
                <label for="department" class="control-label text-muted small fw-bold text-uppercase"> Target
                    Department</label>
                {{ form.department }}
                <div class="form-text small"> Leave blank for system-wide.</div></div></div>

        <div class="mb-3">
            <label for="expiry_date" class="control-label text-muted small fw-bold text-uppercase"> Expiry Date &
                Time</label>
            {{ form.expiry_date }}
            <div class="form-text small"> Notice will be hidden after this time.</div></div></form></div>

<script>$(function () {
        $('#announcement-form').submit(function (e) {
            e.preventDefault();
            var _this = $(this)
            $('.err-msg').remove();
            var el = $(' <div>')
            el.addClass("alert alert-danger err-msg")
            el.hide()
            if (_this[0].checkValidity() == false) {
                _this[0].reportValidity();
                return false;
            }
            start_loader();
            $.ajax({
                url: "{% url 'save-announcement' %}",
                data: new FormData($(this)[0]),
                cache: false,
                contentType: false,
                processData: false,
                method: 'POST',
                type: 'POST',
                dataType: 'json',
                error: err => {
                    console.log(err)
                    alert_toast("An error occurred", 'error');
                    end_loader();
                },
                success: function (resp) {
                    if (typeof resp == 'object' && resp.status == 'success') {
                        location.reload()
                    } else if (resp.status == 'failed' && !!resp.msg) {
                        el.text(resp.msg)
                        _this.prepend(el)
                        el.show('slow')
                        $("html, body").animate({ scrollTop: 0 }, "fast");
                    } else {
                        el.text("An error occurred")
                        _this.prepend(el)
                        el.show('slow')
                        $("html, body").animate({ scrollTop: 0 }, "fast");
                    }
                    end_loader();
                }
            })
        })
    })</script>

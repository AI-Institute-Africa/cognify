<!DOCTYPE html>
<html lang="en">

<head><meta charset="UTF-8">
    <title>Link Expired - RIFTS-X</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body {
            background: #0f0f0f;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
        }</style></head>

<body><div class="glass-card">
        <h1 class="display-1 text-danger mb-4"> <i class="fas fa-exclamation-triangle"></i></h1>
        <h3 class="text-white mb-3"> Invalid Link</h3>
        <p class="text-white-50 mb-4"> {{ error|default:"This secure sharing link has expired, been revoked, or is
            otherwise invalid." }}</p>
        <p class="small text-white-50"> Please contact the document owner for a new access token.</p></div></body></html>

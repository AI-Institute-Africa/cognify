{% extends 'base.html' %} {% block pageContent %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="glass-card border-0 shadow-lg animate-fade-in">
                <div class="card-header bg-primary bg-opacity-10 border-0 py-3">
                    <h5 class="card-title fw-bold mb-0 text-primary"> User Profile</h5></div>
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle shadow-sm mb-3"
                            style="width: 100px; height: 100px; border: 4px solid #fff;">
                            <img src="https://ui-avatars.com/api/?name={{ user.first_name }}+{{ user.last_name }}&background=007bff&color=fff&size=256"
                                class="rounded-circle w-100 h-100" alt="Avatar"></div>
                        <h4 class="fw-bold mb-0"> {{ user.first_name }} {{ user.last_name }}</h4>
                        <p class="text-muted small"> @{{ user.username }}</p></div>

                    <div class="row g-4">
                        <div class="col-12">
                            <label class="text-muted small fw-bold text-uppercase d-block mb-1"> Email Address</label>
                            <p class="mb-0 fw-semibold"> {{ user.email|default:"No email provided" }}</p></div>
                        <div class="col-12">
                            <label class="text-muted small fw-bold text-uppercase d-block mb-1"> System Role</label>
                            <p class="mb-0 fw-semibold text-primary"> Records Intelligence Administrator</p></div></div></div>
                <div class="card-footer bg-light bg-opacity-50 border-0 p-4">
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'update-password' %}"
                            class="btn btn-outline-secondary rounded-pill px-4 btn-sm">
                            <i class="fas fa-key me-2"></i> Change Password</a>
                        <a href="{% url 'update-profile' %}" class="btn btn-primary rounded-pill px-4 btn-sm shadow-sm">
                            <i class="fas fa-edit me-2"></i> Edit Profile</a></div></div></div></div></div></div>

<style>.animate-fade-in {
        animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }</style>
{% endblock pageContent %}

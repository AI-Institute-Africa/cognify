{% load static %} {% load humanize %}
<style>#uni_modal .modal-footer {
        display: none
    }

    #uni_modal .modal-sub-footer {
        display: flex
    }</style>
<div class="container-fluid" id="e-details">
    <div class="d-flex align-items-center mb-4">
        <div class="bg-primary bg-opacity-10 p-3 rounded-3 me-3">
            <i class="fas fa-book-open text-primary h4 mb-0"></i></div>
        <div><h5 class="fw-bold mb-0 text-dark"> Folio Record Detail</h5>
            <p class="text-muted small mb-0"> Records Intelligence archive entry</p></div></div>

    <div class="glass-card bg-light bg-opacity-50 p-4 rounded-3">
        <div class="mb-4">
            <label class="text-muted extra-small fw-bold text-uppercase d-block mb-1"> Associated File</label>
            <div class="d-flex align-items-center">
                <i class="fas fa-folder text-muted me-2 small"></i>
                <span class="fw-bold text-primary"> {{ folio.filee }}</span></div></div>

        <div class="mb-4">
            <label class="text-muted extra-small fw-bold text-uppercase d-block mb-1"> Folio Title / Label</label>
            <h6 class="fw-bold text-dark mb-0"> {{ folio.title }}</h6></div>

        <div><label class="text-muted extra-small fw-bold text-uppercase d-block mb-1"> Folio Description</label>
            <p class="text-muted small mb-0 lh-base"> {{ folio.description|default:"No description provided." }}</p></div></div></div>

<style>.extra-small {
        font-size: 0.65rem;
    }

    #uni_modal .modal-footer {
        display: none;
    }

    #uni_modal .modal-sub-footer {
        display: flex;
    }</style>

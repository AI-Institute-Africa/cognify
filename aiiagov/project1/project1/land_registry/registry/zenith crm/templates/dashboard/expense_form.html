{% extends 'base.html' %}

{% block title %}Add Expense - Confluence Nexus{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h4 mb-3">Add Expense</h1>
                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label" for="id_amount">Amount</label>
                        {{ form.amount }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="id_date">Date</label>
                        {{ form.date }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="id_category">Category</label>
                        {{ form.category }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="id_description">Description</label>
                        {{ form.description }}
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'dashboard:expense_list' %}" class="btn btn-outline-secondary">Back</a>
                        <button type="submit" class="btn btn-primary">Save Expense</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
